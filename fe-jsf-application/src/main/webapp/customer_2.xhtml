<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:jsf="jakarta.faces"
      xmlns:h="jakarta.faces.html">
<f:view>
    <h:head>
        <title>Create New Customer</title>
    </h:head>
    <h:body>
        <h1>Create New Customer</h1>
        <h:form id="form" role="form" class="form">


            <div>
                <label jsf:for="firstName">First Name:</label>
                <input type="text"
                       jsf:id="firstName"
                       jsf:value="#{customerBean.customer.firstName}"
                       jsf:required="true"
                       jsf:requiredMessage="First Name is required."
                       placeholder="Type task name here...">
                </input>
            </div>
            <div>
                <label jsf:for="lastName">Last Name:</label>
                <input type="text"
                       jsf:id="lastName"
                       jsf:value="#{customerBean.customer.lastName}"
                       jsf:required="true"
                       jsf:requiredMessage="Last Name is required."
                       placeholder="Type task name here...">
                </input>
            </div>

            <div class="form-group">
                <h:commandButton id="submitTask" type="submit"
                                 styleClass="btn btn-lg btn-primary"
                                 action="#{customerBean.create()}" value="Save Customer"/>
            </div>
        </h:form>
    </h:body>
</f:view>
</html>
