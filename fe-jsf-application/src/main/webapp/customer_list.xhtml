<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:jsf="jakarta.faces"
      xmlns:h="jakarta.faces.html">
<f:view>
    <h:head>
        <title>Hello, Faces 4.0!</title>
    </h:head>
    <h:body>
        <h1>Create new customer</h1>
        <h:form id="form" role="form" class="form">
            <h:dataTable id="customerTable" value="#{customerListBean.getCustomers()}" var="cs" >
                <h:column>
                    <f:facet name="header">First Name</f:facet>
                    <h:outputText value="#{cs.firstName}" />
                </h:column>
                <h:column>
                    <f:facet name="header">Last Name</f:facet>
                    <h:outputText value="#{cs.lastName}" />
                </h:column>
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Details" />
                    </f:facet>
                    <h:commandLink process="@this" value="Details" action="#{customerDetailsBean.loadDetails(cs.id)}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Edit" />
                    </f:facet>
                    <h:commandLink process="@this" value="Edit" action="#{customerBean.loadDetails(cs.id)}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Delete" />
                    </f:facet>
                    <h:commandLink process="@this" value="Delete" action="#{customerBean.deleteById(cs.id)}"/>
                </h:column>
            </h:dataTable>
        </h:form>
    </h:body>
</f:view>
</html>
